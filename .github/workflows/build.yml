name: Build Release (Android APK & iOS Sideload IPA)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure Android Native Platform
        run: |
          cp -r lib /tmp/lib_backup 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml 2>/dev/null || true
          flutter create . --project-name flow_music --platforms=android --org com.flowmusic
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp -r /tmp/lib_backup/* lib/ 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowMusic-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS Sideloadable IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure iOS Native Platform & Xcode Project
        run: |
          cp -r lib /tmp/lib_backup 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist 2>/dev/null || true
          flutter create . --project-name flow_music --platforms=ios --org com.flowmusic
          cp /tmp/Info.plist ios/Runner/Info.plist 2>/dev/null || true
          cp -r /tmp/lib_backup/* lib/ 2>/dev/null || true

      - name: Install Dependencies & Pods
        run: |
          flutter pub get
          cd ios && pod install --repo-update || true
          cd ..

      - name: Build iOS Application (No Code-sign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloading (AltStore / SideStore / TrollStore)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r FlowMusic-iOS.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowMusic-iOS-Sideload
          path: build/ios/ipa/FlowMusic-iOS.ipa
